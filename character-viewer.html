<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>aurura · 실제 3D 캐릭터 확인</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui;background:#151b35;color:#fff}canvas{display:block;touch-action:none}header{position:absolute;top:0;left:0;right:0;z-index:2;padding:18px 16px 8px;background:linear-gradient(#10162bde,transparent);pointer-events:none}header strong{display:block;font-size:20px}header small{display:block;opacity:.83;margin-top:5px}.controls{position:absolute;bottom:0;left:0;right:0;padding:12px 12px calc(16px + env(safe-area-inset-bottom));display:flex;gap:7px;justify-content:center;flex-wrap:wrap;z-index:3;background:linear-gradient(transparent,#151b35e8)}button,a{background:#605a91e8;border:1px solid #ffffff70;color:white;border-radius:13px;padding:11px 13px;text-decoration:none;font-size:14px;cursor:pointer}.active{background:#b38dd4}#notice{position:absolute;top:90px;left:15px;right:15px;text-align:center;pointer-events:none;font-size:13px;color:#f4e8ff}#back{position:absolute;right:15px;top:18px;z-index:4;background:#3a4167}#status{position:absolute;left:15px;bottom:105px;font-size:11px;color:#eee9ffb5;pointer-events:none}</style></head><body>
<header><strong>🧸 실제 게임 캐릭터 3D 보기</strong><small>한 손가락: 회전 · 두 손가락: 확대/축소</small></header><a id="back" href="./index.html">↩ 게임으로</a><div id="notice">실제 게임에 들어간 GLB 모델을 불러오는 중…</div><div id="status">참고 이미지의 완전한 복제 모델은 아닙니다.</div><div class="controls"><button data-view="front" class="active">정면</button><button data-view="side">옆면</button><button data-view="back">뒷면</button><button id="dog">🐶 강아지 보기</button><button id="zoom">＋ 확대</button></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js"}}</script><script type="module">
import * as THREE from 'three';import {GLTFLoader} from 'https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/loaders/GLTFLoader.js';
const scene=new THREE.Scene();scene.background=new THREE.Color('#a7b6d5');scene.fog=new THREE.Fog('#a7b6d5',20,40);
const camera=new THREE.PerspectiveCamera(35,innerWidth/innerHeight,.1,100);const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.45;document.body.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xf7f3ff,0x6c6b8a,2.5));const key=new THREE.DirectionalLight(0xffe9d7,3.2);key.position.set(-4,9,7);key.castShadow=true;key.shadow.mapSize.set(1024,1024);key.shadow.camera.left=-6;key.shadow.camera.right=6;key.shadow.camera.top=8;key.shadow.camera.bottom=-8;scene.add(key);const rim=new THREE.DirectionalLight(0xc6b1ff,2.2);rim.position.set(5,6,-6);scene.add(rim);
const floor=new THREE.Mesh(new THREE.CircleGeometry(8,80),new THREE.MeshStandardMaterial({color:0xe9e9f5,roughness:1}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
let yaw=0,pitch=.06,distance=8.3,subject=null,viewDog=false;const notice=document.getElementById('notice');
const loader=new GLTFLoader();const models={};const load=(key,path)=>new Promise((resolve,reject)=>loader.load(path,g=>{const m=g.scene;m.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true}});models[key]=m;resolve(m)},undefined,reject));
Promise.all([load('avatar','./assets/winter_avatar.glb'),load('dog','./assets/winter_puppy.glb')]).then(()=>{setSubject(false);notice.textContent='모델 로딩 완료 · 손가락으로 360° 회전해 보세요';setTimeout(()=>{notice.style.opacity='0'},3500)}).catch(e=>{notice.textContent='모델 로딩 실패: 게임 파일 전체를 서버로 실행해 주세요.';console.error(e)});
function setSubject(isDog){viewDog=isDog;if(subject)scene.remove(subject);subject=models[isDog?'dog':'avatar'];if(!subject)return;scene.add(subject);const b=new THREE.Box3().setFromObject(subject);const c=b.getCenter(new THREE.Vector3());subject.position.x-=c.x;subject.position.z-=c.z;subject.position.y-=b.min.y;distance=isDog?4.0:8.3;document.getElementById('dog').textContent=isDog?'🧸 캐릭터 보기':'🐶 강아지 보기';updateCamera()}
function updateCamera(){const h=viewDog?.8:2.0;const rad=distance*Math.cos(pitch);camera.position.set(Math.sin(yaw)*rad,h+Math.sin(pitch)*distance,Math.cos(yaw)*rad);camera.lookAt(0,h,0)}
updateCamera();document.getElementById('dog').onclick=()=>setSubject(!viewDog);document.getElementById('zoom').onclick=()=>{distance=Math.max(viewDog?2.5:4.8,distance-1);updateCamera()};document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{yaw={front:0,side:Math.PI/2,back:Math.PI}[b.dataset.view];pitch=.06;document.querySelectorAll('[data-view]').forEach(x=>x.classList.toggle('active',x===b));updateCamera()});
const touches=new Map();let pinch=0;renderer.domElement.addEventListener('pointerdown',e=>{renderer.domElement.setPointerCapture(e.pointerId);touches.set(e.pointerId,[e.clientX,e.clientY]);});renderer.domElement.addEventListener('pointermove',e=>{if(!touches.has(e.pointerId))return;const prev=touches.get(e.pointerId);touches.set(e.pointerId,[e.clientX,e.clientY]);if(touches.size===1){yaw-=(e.clientX-prev[0])*.009;pitch=THREE.MathUtils.clamp(pitch+(e.clientY-prev[1])*.006,-.65,.8);updateCamera()}else if(touches.size===2){const pts=[...touches.values()];const d=Math.hypot(pts[0][0]-pts[1][0],pts[0][1]-pts[1][1]);if(pinch)distance=THREE.MathUtils.clamp(distance*pinch/d,viewDog?2.5:4.5,15);pinch=d;updateCamera()}});for(const event of ['pointerup','pointercancel'])renderer.domElement.addEventListener(event,e=>{touches.delete(e.pointerId);pinch=0});renderer.domElement.addEventListener('wheel',e=>{distance=THREE.MathUtils.clamp(distance+e.deltaY*.01,viewDog?2.5:4.5,15);updateCamera()},{passive:true});window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});function animate(){requestAnimationFrame(animate);renderer.render(scene,camera)}animate();
</script></body></html>
