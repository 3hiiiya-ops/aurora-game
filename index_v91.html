const externalLegs=[],externalArms=[],externalHair=[];
function avatarPivot(model,names,x,y,z){
 const group=new THREE.Group();group.position.set(x,y,z);model.add(group);
 for(const name of names){const mesh=model.getObjectByName(name);if(!mesh)continue;
  // Mesh vertices are authored in avatar-local coordinates; retain placement while pivoting.
  model.updateMatrixWorld(true);group.updateMatrixWorld(true);group.attach(mesh);
 }

}
function setupExternalMotion(model){

  externalLegs.push(avatarPivot(model,[`leg_${side}`,`boot_${side}`,`boot_sole_${side}`],side*.35,.94,0));
  externalArms.push(avatarPivot(model,[`sleeve_${side}`,`mitten_${side}`,`cuff_${side}`,...[0,1,2].map(n=>`sleeve_quilt_${side}_${n}`)],side*.70,1.87,0));
 }
 for(const side of [-1,1]){
  const hairNames=[];for(let j=0;j<4;j++)hairNames.push(`hair_bob_${side}_${j}`,`hair_long_${side}_${j}`);
  externalHair.push(avatarPivot(model,hairNames,side*.68,3.00,0));

}

  if(!obj.isMesh)return;
  const name=obj.name||'';
  if(name.startsWith('hair_bob_'))obj.visible=appearance.variant==='girl';
  if(name.startsWith('hair_long_'))obj.visible=appearance.variant==='girl-long';
  if(name.startsWith('hair_short_'))obj.visible=appearance.variant==='boy';
  if(name.startsWith('coat_')||name.startsWith('sleeve_')||name.startsWith('mitten_'))obj.material=new THREE.MeshStandardMaterial({color:palette[0],roughness:1});
  if(name.startsWith('scarf_'))obj.material=new THREE.MeshStandardMaterial({color:palette[1],roughness:1});
  if(name.startsWith('leg_'))obj.material=new THREE.MeshStandardMaterial({color:palette[2],roughness:1});
  obj.castShadow=true;obj.receiveShadow=true;
 });
 avatarExternal=model;
 player.add(model);

// Region schedules are staggered. Each appearance lasts 5 minutes, then stays absent
// for 10 FULL minutes. Consequently starts recur every 15 minutes per region.
// Stable UTC epoch + per-region phase offsets keep browsers in sync.
const AURORA_SHOW_SECONDS=300, AURORA_WAIT_SECONDS=600;
const AURORA_PERIOD_SECONDS=AURORA_SHOW_SECONDS+AURORA_WAIT_SECONDS;
const REGION_PHASE_SECONDS=[0,225,450,675]; // Iceland, Norway, Canada, Alaska
function regionClock(region,nowMs=Date.now()+clockOffset){
 const epoch=Math.floor(nowMs/1000)+REGION_PHASE_SECONDS[region];
 const phase=((epoch%AURORA_PERIOD_SECONDS)+AURORA_PERIOD_SECONDS)%AURORA_PERIOD_SECONDS;
 const slot=Math.floor(epoch/AURORA_PERIOD_SECONDS);
 const visible=phase<AURORA_SHOW_SECONDS;
 const remaining=(visible?AURORA_SHOW_SECONDS:AURORA_PERIOD_SECONDS)-phase;
 return {slot,phase,visible,remaining};
}
function cycle(region=current){return regionClock(region).slot}
function auroraSeconds(region=current){return regionClock(region).phase}
