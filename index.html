function animateAtmosphere(t,dt){
 // A small particle cloud follows the player instead of filling the entire map.
 snowfall.position.set(player.position.x,0,player.position.z);
 const a=snowfallGeometry.attributes.position;
 for(let j=0;j<snowCount;j++){
  let y=a.getY(j)-dt*(1.2+j%5*.25);
  if(y<.2)y+=46;
  a.setY(j,y);
  let x=a.getX(j)+dt*(.35+j%3*.11);
  if(x>45)x-=90;
  a.setX(j,x);
 }
 a.needsUpdate=true;
 starsMaterial.opacity=.77+.13*Math.sin(t*.36);
}

function lake(x,z,rx,rz){const g=new THREE.Mesh(new THREE.CircleGeometry(1,64),new THREE.MeshStandardMaterial({color:0x86c6db,roughness:.19,metalness:.12,transparent:true,opacity:.86}));g.rotation.x=-Math.PI/2;g.scale.set(rx,rz,1);g.position.set(x,.045,z);terrain.add(g);
 // Light-weight translucent ripples on lake ice: no costly render-to-texture pass on iPhone.
 for(let k=0;k<5;k++){
  const reflectionMaterial=new THREE.MeshBasicMaterial({color:0x66e8c9,transparent:true,opacity:0,depthWrite:false,blending:THREE.AdditiveBlending,side:THREE.DoubleSide});
  const ripple=new THREE.Mesh(new THREE.PlaneGeometry(rx*(.26+k*.045),rz*.08),reflectionMaterial);
  ripple.rotation.x=-Math.PI/2;ripple.rotation.z=.14+k*.13;
  ripple.position.set(x+rx*(k-2)*.14,.064+k*.0008,z+rz*(k%2?.13:-.12));
  terrain.add(ripple);lakeReflections.push({mesh:ripple,material:reflectionMaterial,x,z,phase:k*.8});
 }
 for(let k=0;k<16;k++){let a=k*Math.PI*2/16;ball(terrain,.8+Math.random()*.7,snow,x+Math.cos(a)*rx,.3,z+Math.sin(a)*rz)}}
function rock(x,z,r,volcanic=false){
 const geo=new THREE.SphereGeometry(r,13,9),pos=geo.attributes.position;
 for(let i=0;i<pos.count;i++){
  const xx=pos.getX(i),yy=pos.getY(i),zz=pos.getZ(i);
  const ripple=1+.14*Math.sin(xx*3.4+z*.3)*Math.cos(zz*4.2+x*.2);
  pos.setXYZ(i,xx*ripple,yy*.59*ripple,zz*1.12*ripple);
 }
 geo.computeVertexNormals();
 const mesh=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({color:volcanic?0x354354:0x8b9db6,roughness:1,flatShading:false}));
 mesh.position.set(x,r*.24,z);mesh.rotation.y=Math.abs(Math.sin(x*5+z))*3;terrain.add(mesh);
}

// Release old region-only GPU assets when moving between regions.
function disposeRegion(){
 lakeReflections.length=0;
 const geometries=new Set(),materials=new Set();
 terrain.traverse(o=>{
  if(o.geometry && o.geometry!==spruceSculptGeo && o.geometry!==spruceSnowGeo)geometries.add(o.geometry);
  if(o.material)(Array.isArray(o.material)?o.material:[o.material]).forEach(m=>materials.add(m));
 });
 terrain.clear();
 geometries.forEach(g=>g.dispose());
 materials.forEach(m=>m.dispose());

async function syncAccount(){
 try{
  const c=await getClient();const {data:{user},error}=await c.auth.getUser();if(error||!user){account=null;return}
  account=user;onlineId=user.id;
  const {data:existing,error:readError}=await c.from('character_profiles').select('variant,palette').eq('user_id',user.id).maybeSingle();
  if(readError)throw readError;
  let profile=existing;
  if(!profile){
   const generated={user_id:user.id,variant:['girl','girl-long','boy'][Math.floor(Math.random()*3)],palette:Math.floor(Math.random()*3)};
   const {data, error:insertError}=await c.from('character_profiles').insert(generated).select('variant,palette').single();
   if(insertError){
    // Another session may have created it first.
    const retry=await c.from('character_profiles').select('variant,palette').eq('user_id',user.id).single();
    if(retry.error)throw insertError;
    profile=retry.data;
   }else profile=data;
  }
  const next={variant:profile.variant,palette:profile.palette};
  if(JSON.stringify(next)!==JSON.stringify(appearance)){
   localStorage.setItem(savedKey,JSON.stringify(next));
   location.reload();
  }
  notice('🔐 내 고유 캐릭터를 불러왔어요!');
 }catch(e){console.error(e);notice('계정 동기화 실패: Supabase 테이블과 RLS 설정을 확인해 주세요.')}
}

// Region schedules are staggered. Each appearance lasts 5 minutes, then stays absent
// for 10 FULL minutes. Consequently starts recur every 15 minutes per region.
// Stable UTC epoch + per-region phase offsets keep browsers in sync.
const AURORA_SHOW_SECONDS=300, AURORA_WAIT_SECONDS=600;
const AURORA_PERIOD_SECONDS=AURORA_SHOW_SECONDS+AURORA_WAIT_SECONDS;
const REGION_PHASE_SECONDS=[0,225,450,675]; // Iceland, Norway, Canada, Alaska
function regionClock(region,nowMs=Date.now()+clockOffset){
 const epoch=Math.floor(nowMs/1000)+REGION_PHASE_SECONDS[region];
 const phase=((epoch%AURORA_PERIOD_SECONDS)+AURORA_PERIOD_SECONDS)%AURORA_PERIOD_SECONDS;
 const slot=Math.floor(epoch/AURORA_PERIOD_SECONDS);
 const visible=phase<AURORA_SHOW_SECONDS;
 const remaining=(visible?AURORA_SHOW_SECONDS:AURORA_PERIOD_SECONDS)-phase;
 return {slot,phase,visible,remaining};
}

function auroraSeconds(region=current){return regionClock(region).phase}
function auroraVisibleNow(region=current){return regionClock(region).visible}

  if('serviceWorker' in navigator){try{const reg=await navigator.serviceWorker.getRegistration();add('PWA 캐시 등록',!!reg,reg?'등록됨':'아직 등록되지 않음');}catch{add('PWA 캐시 등록',false,'확인 실패');}}
  const required=['map','joystick','testkit','testkitPanel','aururaErrorIndicator'];
  const missing=required.filter(id=>!document.getElementById(id));add('필수 UI',missing.length===0,missing.length?'누락: '+missing.join(', '):'요소 확인됨');
  output.textContent='aurura game v42 · 자동 환경 점검\n'+rows.join('\n')+'\n\n※ 환경 점검은 실제 게임 플레이·멀티플레이 정상 작동을 보장하지 않아.';
  button.disabled=false;button.textContent='🔎 자동 환경 점검';
 });
})();
</script></body></html>
