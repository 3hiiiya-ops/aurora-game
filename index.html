function setRegionAtmosphere(region){

 scene.background=cubeLoaded===6?cubeSky:new THREE.Color(region===0?0x030913:a.sky);scene.fog.color.setHex(a.fog);scene.fog.density=region===0?.0012:.0055;

function animateAtmosphere(t,dt){
 // A small particle cloud follows the player instead of filling the entire map.
 snowfall.position.set(player.position.x,0,player.position.z);
 const a=snowfallGeometry.attributes.position;
 for(let j=0;j<snowCount;j++){
  let y=a.getY(j)-dt*(1.2+j%5*.25);
  if(y<.2)y+=46;
  a.setY(j,y);
  let x=a.getX(j)+dt*(.35+j%3*.11);
  if(x>45)x-=90;
  a.setX(j,x);
 }
 a.needsUpdate=true;
 starsMaterial.opacity=.77+.13*Math.sin(t*.36);
}
const lakeReflections=[];
function lake(x,z,rx,rz){const g=new THREE.Mesh(new THREE.CircleGeometry(1,64),new THREE.MeshStandardMaterial({color:0x86c6db,roughness:.19,metalness:.12,transparent:true,opacity:.86}));g.rotation.x=-Math.PI/2;g.scale.set(rx,rz,1);g.position.set(x,.045,z);terrain.add(g);
 // Light-weight translucent ripples on lake ice: no costly render-to-texture pass on iPhone.
 for(let k=0;k<5;k++){
  const reflectionMaterial=new THREE.MeshBasicMaterial({color:0x66e8c9,transparent:true,opacity:0,depthWrite:false,blending:THREE.AdditiveBlending,side:THREE.DoubleSide});
  const ripple=new THREE.Mesh(new THREE.PlaneGeometry(rx*(.26+k*.045),rz*.08),reflectionMaterial);
  ripple.rotation.x=-Math.PI/2;ripple.rotation.z=.14+k*.13;
  ripple.position.set(x+rx*(k-2)*.14,.064+k*.0008,z+rz*(k%2?.13:-.12));
  terrain.add(ripple);lakeReflections.push({mesh:ripple,material:reflectionMaterial,x,z,phase:k*.8});
 }
 for(let k=0;k<16;k++){let a=k*Math.PI*2/16;ball(terrain,.8+Math.random()*.7,snow,x+Math.cos(a)*rx,.3,z+Math.sin(a)*rz)}}
function rock(x,z,r,volcanic=false){
 const geo=new THREE.SphereGeometry(r,13,9),pos=geo.attributes.position;
 for(let i=0;i<pos.count;i++){
  const xx=pos.getX(i),yy=pos.getY(i),zz=pos.getZ(i);
  const ripple=1+.14*Math.sin(xx*3.4+z*.3)*Math.cos(zz*4.2+x*.2);
  pos.setXYZ(i,xx*ripple,yy*.59*ripple,zz*1.12*ripple);
 }
 geo.computeVertexNormals();
 const mesh=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({color:volcanic?0x354354:0x8b9db6,roughness:1,flatShading:false}));
 mesh.position.set(x,r*.24,z);mesh.rotation.y=Math.abs(Math.sin(x*5+z))*3;terrain.add(mesh);
}

// Release old region-only GPU assets when moving between regions.
function disposeRegion(){
 lakeReflections.length=0;
 const geometries=new Set(),materials=new Set();
 terrain.traverse(o=>{
  if(o.geometry && o.geometry!==spruceSculptGeo && o.geometry!==spruceSnowGeo)geometries.add(o.geometry);
  if(o.material)(Array.isArray(o.material)?o.material:[o.material]).forEach(m=>materials.add(m));
 });
 terrain.clear();
 geometries.forEach(g=>g.dispose());
 materials.forEach(m=>m.dispose());
}
// Region-specific base camps: Iceland geothermal shelter, Norway red fishing lodge,
// Canada log-cabin outpost, Alaska expedition tents. Simple prototype geometry.
function baseCamp(region){
 const dark=material(0x4d4b62),cream=material(0xece9df),stone=material(0x566071),amber=new THREE.MeshBasicMaterial({color:0xffdca0}),warm=amber;
 if(region===0){
  // Iceland: dark basalt geothermal station, pale roof, steaming thermal pool.
  cube(terrain,12,4.2,8,material(0x343b48),-12,2.1,-12);
  cube(terrain,13,.65,9,cream,-12,4.65,-12);
  for(let j=0;j<3;j++)cube(terrain,1.5,1.5,.12,amber,-16+j*3.5,2.8,-7.92);
  for(let j=0;j<5;j++)column(-27+j*2.5,-23,3+j%2);
  lake(-4,-29,8,6);
 }else if(region===1){
  // Norway: tall red stilt fishing lodge and waterside wooden boardwalk.
  const red=material(0xb34753);
  cube(terrain,11,6,9,red,-14,5,-16);
  for(const x of [-18,-10])for(const z of [-19,-13])cube(terrain,.75,3,.75,dark,x,1.5,z);
  cube(terrain,13,.65,11,material(0x45435c),-14,8.35,-16);
  for(let j=0;j<3;j++)cube(terrain,1.6,1.8,.13,amber,-18+j*4,5.2,-11.43);
  dock(-9,-28);
 }else if(region===2){
  // Canada: timber ranger station, roof snow and dense spruce grove.
  const timber=material(0x88674e);
  cube(terrain,12,4.7,9,timber,-14,2.35,-13);
  for(let j=0;j<6;j++)cube(terrain,12,.22,.3,material(0x5e483b),-14,1+j*.67,-8.35);
  let a=cube(terrain,9,.75,10,cream,-17,5.5,-13);a.rotation.z=-.32;
  let b=cube(terrain,9,.75,10,cream,-11,5.5,-13);b.rotation.z=.32;
  cube(terrain,2,2,.13,amber,-14,2.8,-8.32);
  for(let j=0;j<7;j++)tree(-26+j*3,-27-(j%3)*3,.55+(j%2)*.2);
 }else{
  // Alaska: expedition domes, solar equipment and tall signal mast.
  const orange=material(0xdd8b64),blue=material(0x7794b2);
  for(const [x,z,r] of [[-15,-14,4.5],[-26,-23,3.3]]){
   const dome=new THREE.Mesh(new THREE.SphereGeometry(r,12,7,0,Math.PI*2,0,Math.PI/2),orange);
   dome.position.set(x,0,z);terrain.add(dome);
   cube(terrain,r*1.2,1.8,.15,dark,x,.9,z+r*.77);
  }
  cube(terrain,5,.3,3,blue,-5,1.5,-20);
  cube(terrain,.18,9,.18,dark,1,4.5,-17);
  ball(terrain,.6,amber,1,9.2,-17);
 }
}

 try {
