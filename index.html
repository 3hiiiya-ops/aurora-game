async function joinOnline(){
 if(!config.url||!config.publishableKey){
  notice('현재는 온라인 연결 전이에요. Supabase 공개 연결 설정이 필요해요.');
  return;
 }
 if(room){notice('이미 접속했어요!');return}
 if(!account){notice('먼저 계정에서 이메일 로그인을 해주세요.');return}
 try {
  client=await getClient();
  room=client.channel('aurura-explore-v1',{config:{broadcast:{self:false},presence:{key:onlineId}}});
  room.on('broadcast',{event:'move'},({payload})=>{if(payload?.id!==onlineId&&typeof payload?.x==='number'&&typeof payload?.z==='number'&&Math.abs(payload.x)<450&&Math.abs(payload.z)<450)otherAvatar(payload)});
  room.on('broadcast',{event:'chat'},({payload})=>{if(payload?.id!==onlineId && payload?.region===current && typeof payload?.message==='string')appendChat('여행자',payload.message.slice(0,120))});
  room.on('broadcast',{event:'wave'},({payload})=>{if(payload?.id!==onlineId)notice('👋 다른 여행자가 인사했어요!')});
  room.on('presence',{event:'sync'},()=>{
   const state=room.presenceState();const seen=new Set();
   Object.values(state).flat().forEach(p=>{if(p.id!==onlineId){seen.add(p.id);otherAvatar(p)}});
   for(const id of others.keys())if(!seen.has(id))removeOther(id);
  });
  await new Promise((resolve,reject)=>{
   room.subscribe(async status=>{
    if(status==='SUBSCRIBED'){
     await room.track({id:onlineId,region:current,x:player.position.x,z:player.position.z,palette:appearance.palette});
     resolve();
    }else if(status==='CHANNEL_ERROR'||status==='TIMED_OUT')reject(new Error(status));
   });
  });
  onlineState='온라인';notice('👥 실시간 탐험방에 연결됐어요!');
 }catch(err){console.error(err);room=null;onlineState='연결 실패';notice('온라인 연결 실패. 공개 키와 Realtime 설정을 확인해 주세요.')}
}

// Region schedules are staggered. Each appearance lasts 5 minutes, then stays absent
// for 10 FULL minutes. Consequently starts recur every 15 minutes per region.
// Stable UTC epoch + per-region phase offsets keep browsers in sync.
const AURORA_SHOW_SECONDS=300, AURORA_WAIT_SECONDS=600;
const AURORA_PERIOD_SECONDS=AURORA_SHOW_SECONDS+AURORA_WAIT_SECONDS;
const REGION_PHASE_SECONDS=[0,225,450,675]; // Iceland, Norway, Canada, Alaska
function regionClock(region,nowMs=Date.now()+clockOffset){
 const epoch=Math.floor(nowMs/1000)+REGION_PHASE_SECONDS[region];
 const phase=((epoch%AURORA_PERIOD_SECONDS)+AURORA_PERIOD_SECONDS)%AURORA_PERIOD_SECONDS;
 const slot=Math.floor(epoch/AURORA_PERIOD_SECONDS);
 const visible=phase<AURORA_SHOW_SECONDS;
 const remaining=(visible?AURORA_SHOW_SECONDS:AURORA_PERIOD_SECONDS)-phase;
 return {slot,phase,visible,remaining};
}
function cycle(region=current){return regionClock(region).slot}
function auroraSeconds(region=current){return regionClock(region).phase}
function auroraVisibleNow(region=current){return regionClock(region).visible}
function active(){return names.map((_,i)=>auroraVisibleNow(i))}
function hasDiscovered(){return discoveries().includes(cycle()+':'+current)}
async function refreshSky(){
 if(!config.url||!config.publishableKey)return;
 try{
  const c=await getClient();const t0=Date.now();
  const {data,error}=await c.rpc('aurora_cycle');if(error)throw error;
  const t1=Date.now();if(!data||!Array.isArray(data.active)||data.active.length!==4)throw Error('Invalid sky data');
  const serverMs=Number(data.server_ms);
  if(!Number.isFinite(serverMs)||Math.abs(serverMs-Date.now())>86400000)throw Error('Unexpected server timestamp');
  clockOffset=serverMs-(t0+t1)/2;
  skyState={cycle:Number(data.cycle),active:data.active};
  skyMode='서버 동기화';
 }catch(e){console.warn('Aurora sync unavailable',e);skyMode='오프라인 시연';skyState=null}
}
setInterval(refreshSky,15000);refreshSky();
document.addEventListener('visibilitychange',()=>{
 if(!document.hidden){refreshSky();for(const k in keys)keys[k]=false;}
});
function observationPoint(i,slot){const r=random(slot*619+i*197+53);const a=r()*Math.PI*2;const distance=32+r()*48;return {x:Math.cos(a)*distance,z:Math.sin(a)*distance}}

// No Math.random(): every visitor viewing the same region/slot sees the same palette.
const auroraPalettes=[

 [{name:'보라·분홍',colors:[0x9e7dff,0xf09afc,0xc79aff,0xf4b3e7,0x9ca5ff]},{name:'라벤더·푸른빛',colors:[0xb5a0ff,0x81adff,0xd5a5ff,0x87d9ff,0xe5b4f7]}],
 [{name:'아이스블루·청록',colors:[0x68dfff,0x5affd5,0x86cfff,0x9ff5ed,0x52aaff]},{name:'푸른빛·민트',colors:[0x70aaff,0x7de7ff,0x78ffdb,0x9fd9ff,0x5dddcf]}],
 [{name:'장밋빛·황금빛',colors:[0xffa2bf,0xffd68c,0xfca7e8,0xffb6a0,0xffe2a5]},{name:'자주·코랄',colors:[0xe58aff,0xff9a9d,0xffb7dc,0xe6a7ff,0xffc0a0]}]

function auroraPalette(region,slot){const options=auroraPalettes[region];return options[Math.floor(random(slot*131+region*997+11)()*options.length)]}
let appliedPaletteRegion=-1,appliedPaletteSlot=-1;
function applyAuroraPalette(region,slot){
 if(region===appliedPaletteRegion&&slot===appliedPaletteSlot)return;
 const palette=auroraPalette(region,slot);
 aurora.forEach((mesh,i)=>{
  mesh.material.uniforms.uGreen.value.setHex(palette.colors[i%palette.colors.length]);
  mesh.material.uniforms.uPurple.value.setHex(region===0?0xb28bff:palette.colors[(i+2)%palette.colors.length]);
 });
 glowMats.forEach((mat,i)=>mat.color.setHex(palette.colors[(i+1)%palette.colors.length]));

// The sighting has a subtle distant afterglow before the full aurora becomes visible.
// Each region has its own deterministic location per shared 10-minute slot.

function updateLakeReflections(t,slot){
 const spot=observationPoint(current,slot),palette=auroraPalette(current,slot);
 for(let i=0;i<lakeReflections.length;i++){
  const r=lakeReflections[i];
  const dist=Math.hypot(r.x-spot.x,r.z-spot.z);
  const near=THREE.MathUtils.smoothstep(120-dist,0,105);
  const observer=THREE.MathUtils.smoothstep(105-auroraDistance(),0,90);
  r.material.color.setHex(palette.colors[i%palette.colors.length]);
  r.material.opacity=auroraVisibleNow()?Math.min(.23,near*observer*(.065+.035*Math.sin(t*1.1+r.phase))):0;
  r.mesh.scale.x=1+.12*Math.sin(t*.5+r.phase);
 }

function updateAuroraVisibility(t){
 const slot=cycle();applyAuroraPalette(current,slot);updateLakeReflections(t,slot);
 const activeSky=auroraVisibleNow();
 // Sky direction indicates the real scheduled observation point; no need to reach it to see the sky.
 const point=observationPoint(current,slot);
 const dx=point.x-player.position.x,dz=point.z-player.position.z;
 const dist=Math.max(1,Math.hypot(dx,dz));
 const x=dx/dist,z=dz/dist;
 // Keep sky effects within 115 game metres, so they remain visible inside the far plane
 // regardless of where the player stands on the 3x Iceland map.
 const skyX=player.position.x+x*105,skyZ=player.position.z+z*105;
 auroraSky.position.set(skyX,0,skyZ);
 auroraHaze.position.set(skyX,0,skyZ);
 const facing=Math.atan2(x,z);
 auroraSky.rotation.y=facing;
 auroraHaze.rotation.y=facing;
 const pulse=.93+.07*Math.sin(t*.35);
 for(let i=0;i<aurora.length;i++){
  const mesh=aurora[i],u=mesh.material.uniforms;
  u.uTime.value=t+i*.67;
  u.uOpacity.value=activeSky?(current===0?.45:.34)*pulse*(1-.07*i):0;
  mesh.visible=activeSky;
 }
 auroraHaze.visible=activeSky;
 for(let i=0;i<auroraHazeMaterials.length;i++){
  auroraHazeMaterials[i].opacity=activeSky?(.035+i*.008)*pulse:0;
 }
 auroraGroundGlow.visible=activeSky;
 auroraGroundGlow.position.set(player.position.x,.13,player.position.z);
 auroraGroundGlow.material.opacity=activeSky?.07*pulse:0;
 distantGlow.visible=false;
}
