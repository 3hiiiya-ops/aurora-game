 if(!client){const {createClient}=await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');client=createClient(config.url,config.publishableKey)}
 return client;
}
async function syncAccount(){
 try{
  const c=await getClient();const {data:{user},error}=await c.auth.getUser();if(error||!user){account=null;return}
  account=user;onlineId=user.id;
  const {data:existing,error:readError}=await c.from('character_profiles').select('variant,palette').eq('user_id',user.id).maybeSingle();
  if(readError)throw readError;
  let profile=existing;
  if(!profile){
   const generated={user_id:user.id,variant:Math.random()<.5?'girl':'boy',palette:Math.floor(Math.random()*3)};
   const {data, error:insertError}=await c.from('character_profiles').insert(generated).select('variant,palette').single();
   if(insertError){
    // Another session may have created it first.
    const retry=await c.from('character_profiles').select('variant,palette').eq('user_id',user.id).single();
    if(retry.error)throw insertError;
    profile=retry.data;
   }else profile=data;
  }
  const next={variant:profile.variant,palette:profile.palette};
  if(JSON.stringify(next)!==JSON.stringify(appearance)){
   localStorage.setItem(savedKey,JSON.stringify(next));
   location.reload();
  }
  notice('🔐 내 고유 캐릭터를 불러왔어요!');
 }catch(e){console.error(e);notice('계정 동기화 실패: Supabase 테이블과 RLS 설정을 확인해 주세요.')}
}

async function joinOnline(){

  notice('현재는 온라인 연결 전이에요. Supabase 공개 연결 설정이 필요해요.');
  return;
 }
 if(room){notice('이미 접속했어요!');return}
 if(!account){notice('먼저 계정에서 이메일 로그인을 해주세요.');return}
 try {
  client=await getClient();
  room=client.channel('aurura-explore-v1',{config:{broadcast:{self:false},presence:{key:onlineId}}});
  room.on('broadcast',{event:'move'},({payload})=>{if(payload?.id!==onlineId&&typeof payload?.x==='number'&&typeof payload?.z==='number'&&Math.abs(payload.x)<450&&Math.abs(payload.z)<450)otherAvatar(payload)});

   const state=room.presenceState();const seen=new Set();
   Object.values(state).flat().forEach(p=>{if(p.id!==onlineId){seen.add(p.id);otherAvatar(p)}});
   for(const id of others.keys())if(!seen.has(id))removeOther(id);
  });
  await new Promise((resolve,reject)=>{
   room.subscribe(async status=>{
    if(status==='SUBSCRIBED'){
     await room.track({id:onlineId,region:current,x:player.position.x,z:player.position.z,palette:appearance.palette});
     resolve();
    }else if(status==='CHANNEL_ERROR'||status==='TIMED_OUT')reject(new Error(status));
   });
  });
  onlineState='온라인';notice('👥 실시간 탐험방에 연결됐어요!');
 }catch(err){console.error(err);room=null;onlineState='연결 실패';notice('온라인 연결 실패. 공개 키와 Realtime 설정을 확인해 주세요.')}
}

async function refreshSky(){
 if(!config.url||!config.publishableKey)return;
 try{
  const c=await getClient();const t0=Date.now();
  const {data,error}=await c.rpc('aurora_cycle');if(error)throw error;
  const t1=Date.now();if(!data||!Array.isArray(data.active)||data.active.length!==4)throw Error('Invalid sky data');
  const serverMs=Number(data.server_ms);
  if(!Number.isFinite(serverMs)||Math.abs(serverMs-Date.now())>86400000)throw Error('Unexpected server timestamp');
  clockOffset=serverMs-(t0+t1)/2;
  skyState={cycle:Number(data.cycle),active:data.active.map(Boolean)};
  skyMode='서버 동기화';
 }catch(e){console.warn('Aurora sync unavailable',e);skyMode='오프라인 시연';skyState=null}
}
