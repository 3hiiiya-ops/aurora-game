// Region schedules are staggered. Each appearance lasts 5 minutes, then stays absent
// for 10 FULL minutes. Consequently starts recur every 15 minutes per region.
// Stable UTC epoch + per-region phase offsets keep browsers in sync.
const AURORA_SHOW_SECONDS=300, AURORA_WAIT_SECONDS=600;

function regionClock(region,nowMs=Date.now()+clockOffset){

 const slot=Math.floor(epoch/AURORA_PERIOD_SECONDS);
 const visible=phase<AURORA_SHOW_SECONDS;

 return {slot,phase,visible,remaining};
}

function render(){items.replaceChildren();checks.forEach((name,i)=>{const label=document.createElement('label'),input=document.createElement('input');input.type='checkbox';input.checked=!!state[i];input.addEventListener('change',()=>{state[i]=input.checked;persist();renderCount()});label.append(input,document.createTextNode(' '+name));items.append(label)});renderCount();info.textContent=deviceInfo()}
function renderCount(){count.textContent='확인한 항목: '+checks.filter((_,i)=>state[i]).length+' / '+checks.length}
function report(){return 'aurura game v42 중간 테스트\n'+deviceInfo()+'\n\n'+checks.map((c,i)=>(state[i]?'[확인] ':'[미확인] ')+c).join('\n')}
document.getElementById('testkit').onclick=()=>{render();panel.classList.add('show')};
document.getElementById('testkitClose').onclick=()=>panel.classList.remove('show');
document.getElementById('testkitReset').onclick=()=>{state={};persist();render()};
document.getElementById('testkitCopy').onclick=async()=>{const value=report();try{await navigator.clipboard.writeText(value);alert('점검 결과를 복사했어!')}catch{const t=document.createElement('textarea');t.value=value;document.body.append(t);t.select();try{document.execCommand('copy');alert('점검 결과 복사를 시도했어.')}catch{alert(value)}t.remove()}};
panel.addEventListener('click',e=>{if(e.target===panel)panel.classList.remove('show')});
})();
</script><script>
(()=>{
 const issues=[];
 const stamp=()=>new Date().toLocaleTimeString('ko-KR');
 function record(message){
  const clean=String(message||'알 수 없는 오류').slice(0,320);
  issues.push(`${stamp()} · ${clean}`);if(issues.length>20)issues.shift();
  const indicator=document.getElementById('aururaErrorIndicator');
  if(indicator){indicator.hidden=false;indicator.textContent=`⚠️ 오류 기록 ${issues.length}개`;}
 }
 window.addEventListener('error',event=>record(event.message||'스크립트 오류'));
 window.addEventListener('unhandledrejection',event=>record(event.reason?.message||'비동기 작업 오류'));
 const badge=document.createElement('button');badge.id='aururaErrorIndicator';badge.hidden=true;
 badge.setAttribute('aria-label','오류 기록 보기');badge.textContent='⚠️ 오류 기록';
 badge.style.cssText='position:fixed;bottom:calc(160px + env(safe-area-inset-bottom));left:10px;z-index:30;background:#643f56;color:white;border:1px solid #ffffff80;border-radius:12px;padding:8px;font:12px system-ui;max-width:140px';
 document.body.append(badge);
 badge.addEventListener('click',()=>{
  const result='aurura game v42 오류 기록\n'+(issues.length?issues.join('\n'):'기록된 오류 없음');
  const panel=document.getElementById('testkitPanel');
  if(panel){panel.classList.add('show');const info=document.getElementById('testkitInfo');if(info)info.textContent+='\n\n'+result;}
  else alert(result);
 });
 const copy=document.getElementById('testkitCopy');
 if(copy)copy.addEventListener('click',()=>{
  if(!issues.length)return;
  const t=document.createElement('textarea');t.value='오류 기록\n'+issues.join('\n');
  // Separate error copy control avoids overwriting the existing test report clipboard.
 });
 const btn=document.createElement('button');btn.textContent='⚠️ 오류 기록 복사';btn.id='aururaCopyErrors';
 btn.addEventListener('click',async()=>{
  const value='aurura game v42 오류 기록\n'+(issues.length?issues.join('\n'):'기록된 오류 없음');
  try{await navigator.clipboard.writeText(value);alert('오류 기록을 복사했어!');}
  catch{prompt('오류 기록을 길게 눌러 복사해 줘',value);}
 });
 const body=document.getElementById('testkitBody');if(body)body.append(btn);
})();
</script><script>
// v39: Read-only environment preflight for 50% checkpoint.
(()=>{
 const host=document.getElementById('testkitBody');if(!host)return;
 const button=document.createElement('button');button.textContent='🔎 자동 환경 점검';button.id='aururaPreflight';
 const output=document.createElement('pre');output.id='aururaPreflightResult';output.style.cssText='white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;line-height:1.5';
 host.append(button,output);
 button.addEventListener('click',async()=>{
  button.disabled=true;button.textContent='🔎 확인 중…';
  const rows=[];const add=(name,ok,note)=>rows.push(`${ok?'✅':'⚠️'} ${name}: ${note}`);
  let gl=false;try{const canvas=document.createElement('canvas');gl=!!(canvas.getContext('webgl2')||canvas.getContext('webgl'));}catch{}
  add('3D 그래픽',gl,gl?'WebGL 사용 가능':'WebGL 사용 불가');
  add('인터넷 연결',navigator.onLine,navigator.onLine?'온라인 표시':'오프라인 표시');
  add('보안 연결',location.protocol==='https:'||location.hostname==='localhost',location.protocol);
  add('화면 크기',true,`${innerWidth} × ${innerHeight}`);
  add('터치 입력','ontouchstart' in window||navigator.maxTouchPoints>0,'지원 터치 수: '+(navigator.maxTouchPoints||0));
  add('서비스 워커','serviceWorker' in navigator,'serviceWorker' in navigator?'지원':'미지원');
  if('serviceWorker' in navigator){try{const reg=await navigator.serviceWorker.getRegistration();add('PWA 캐시 등록',!!reg,reg?'등록됨':'아직 등록되지 않음');}catch{add('PWA 캐시 등록',false,'확인 실패');}}
  const required=['map','joystick','testkit','testkitPanel','aururaErrorIndicator'];
  const missing=required.filter(id=>!document.getElementById(id));add('필수 UI',missing.length===0,missing.length?'누락: '+missing.join(', '):'요소 확인됨');
  output.textContent='aurura game v42 · 자동 환경 점검\n'+rows.join('\n')+'\n\n※ 환경 점검은 실제 게임 플레이·멀티플레이 정상 작동을 보장하지 않아.';
  button.disabled=false;button.textContent='🔎 자동 환경 점검';
 });
})();
</script></body></html>
