// Region schedules are staggered. Each appearance lasts 5 minutes, then stays absent
// for 10 FULL minutes. Consequently starts recur every 15 minutes per region.
// Stable UTC epoch + per-region phase offsets keep browsers in sync.
const AURORA_SHOW_SECONDS=300, AURORA_WAIT_SECONDS=600;
const AURORA_PERIOD_SECONDS=AURORA_SHOW_SECONDS+AURORA_WAIT_SECONDS;
const REGION_PHASE_SECONDS=[0,225,450,675]; // Iceland, Norway, Canada, Alaska
function regionClock(region,nowMs=Date.now()+clockOffset){
 const epoch=Math.floor(nowMs/1000)+REGION_PHASE_SECONDS[region];
 const phase=((epoch%AURORA_PERIOD_SECONDS)+AURORA_PERIOD_SECONDS)%AURORA_PERIOD_SECONDS;
 const slot=Math.floor(epoch/AURORA_PERIOD_SECONDS);
 const visible=phase<AURORA_SHOW_SECONDS;
 const remaining=(visible?AURORA_SHOW_SECONDS:AURORA_PERIOD_SECONDS)-phase;
 return {slot,phase,visible,remaining};
}
function cycle(region=current){return regionClock(region).slot}
function auroraSeconds(region=current){return regionClock(region).phase}
function auroraVisibleNow(region=current){return regionClock(region).visible}
function active(){return names.map((_,i)=>auroraVisibleNow(i))}
function hasDiscovered(){return discoveries().includes(cycle()+':'+current)}

  const t1=Date.now();if(!data||!Array.isArray(data.active)||data.active.length!==4)throw Error('Invalid sky data');
  const serverMs=Number(data.server_ms);
  if(!Number.isFinite(serverMs)||Math.abs(serverMs-Date.now())>86400000)throw Error('Unexpected server timestamp');
  clockOffset=serverMs-(t0+t1)/2;
  skyState={cycle:Number(data.cycle),active:data.active};
  skyMode='서버 동기화';
 }catch(e){console.warn('Aurora sync unavailable',e);skyMode='오프라인 시연';skyState=null}
}

<section id="testkitPanel" role="dialog" aria-modal="true" aria-label="중간 테스트 도구"><div id="testkitBody">
<h2>🛠️ aurura 중간 테스트</h2><p>50% 중간 테스트를 위한 준비 도구야. 아래 항목은 직접 확인한 뒤 체크해 줘.</p>

<script>
(()=>{
const checks=['게임 화면이 정상적으로 나타남','왼쪽 조이스틱으로 이동 가능','오른쪽 드래그로 360° 회전 가능','하늘을 올려다볼 수 있음','지역 4곳 이동 가능','지역별 오로라 색상 확인','자유롭게 설원 탐험','사진 촬영/앨범 열기','채팅과 계정 상태 확인','홈 화면에 추가 가능'];
const panel=document.getElementById('testkitPanel'),items=document.getElementById('testkitChecks'),count=document.getElementById('testkitCount'),info=document.getElementById('testkitInfo');
let state={};try{state=JSON.parse(localStorage.getItem('aurura-testkit-v37')||'{}')||{}}catch{}
function persist(){try{localStorage.setItem('aurura-testkit-v37',JSON.stringify(state))}catch{}}
function deviceInfo(){return ['버전: v42','브라우저: '+navigator.userAgent,'화면: '+innerWidth+' × '+innerHeight,'배율: '+(devicePixelRatio||1),'온라인: '+(navigator.onLine?'예':'아니오'),'HTTPS: '+(location.protocol==='https:'?'예':'아니오'),'홈 화면 실행: '+((matchMedia('(display-mode: standalone)').matches||navigator.standalone)?'예':'아니오'),'WebGL: '+(document.createElement('canvas').getContext('webgl2')?'WebGL2':document.createElement('canvas').getContext('webgl')?'WebGL1':'미지원')].join('\n')}
function render(){items.replaceChildren();checks.forEach((name,i)=>{const label=document.createElement('label'),input=document.createElement('input');input.type='checkbox';input.checked=!!state[i];input.addEventListener('change',()=>{state[i]=input.checked;persist();renderCount()});label.append(input,document.createTextNode(' '+name));items.append(label)});renderCount();info.textContent=deviceInfo()}
function renderCount(){count.textContent='확인한 항목: '+checks.filter((_,i)=>state[i]).length+' / '+checks.length}
function report(){return 'aurura game v42 중간 테스트\n'+deviceInfo()+'\n\n'+checks.map((c,i)=>(state[i]?'[확인] ':'[미확인] ')+c).join('\n')}
document.getElementById('testkit').onclick=()=>{render();panel.classList.add('show')};
document.getElementById('testkitClose').onclick=()=>panel.classList.remove('show');
document.getElementById('testkitReset').onclick=()=>{state={};persist();render()};
document.getElementById('testkitCopy').onclick=async()=>{const value=report();try{await navigator.clipboard.writeText(value);alert('점검 결과를 복사했어!')}catch{const t=document.createElement('textarea');t.value=value;document.body.append(t);t.select();try{document.execCommand('copy');alert('점검 결과 복사를 시도했어.')}catch{alert(value)}t.remove()}};
panel.addEventListener('click',e=>{if(e.target===panel)panel.classList.remove('show')});
})();
</script><script>

 });
 const copy=document.getElementById('testkitCopy');
 if(copy)copy.addEventListener('click',()=>{
  if(!issues.length)return;

  // Separate error copy control avoids overwriting the existing test report clipboard.
 });
 const btn=document.createElement('button');btn.textContent='⚠️ 오류 기록 복사';btn.id='aururaCopyErrors';
 btn.addEventListener('click',async()=>{
