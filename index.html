async function syncAccount(){

  const c=await getClient();const {data:{user},error}=await c.auth.getUser();if(error||!user){account=null;return}
  account=user;onlineId=user.id;
  const {data:existing,error:readError}=await c.from('character_profiles').select('variant,palette').eq('user_id',user.id).maybeSingle();
  if(readError)throw readError;
  let profile=existing;
  if(!profile){
   const generated={user_id:user.id,variant:Math.random()<.5?'girl':'boy',palette:Math.floor(Math.random()*3)};
   const {data, error:insertError}=await c.from('character_profiles').insert(generated).select('variant,palette').single();

    const retry=await c.from('character_profiles').select('variant,palette').eq('user_id',user.id).single();
    if(retry.error)throw insertError;
    profile=retry.data;
   }else profile=data;
  }
  const next={variant:profile.variant,palette:profile.palette};
  if(JSON.stringify(next)!==JSON.stringify(appearance)){
   localStorage.setItem(savedKey,JSON.stringify(next));

async function joinOnline(){
 if(!config.url||!config.publishableKey){
  notice('현재는 온라인 연결 전이에요. Supabase 공개 연결 설정이 필요해요.');
  return;
 }
 if(room){notice('이미 접속했어요!');return}
 if(!account){notice('먼저 계정에서 이메일 로그인을 해주세요.');return}
 try {
  client=await getClient();
  room=client.channel('aurura-explore-v1',{config:{broadcast:{self:false},presence:{key:onlineId}}});
  room.on('broadcast',{event:'move'},({payload})=>{if(payload?.id!==onlineId&&typeof payload?.x==='number'&&typeof payload?.z==='number'&&Math.abs(payload.x)<450&&Math.abs(payload.z)<450)otherAvatar(payload)});
  room.on('broadcast',{event:'chat'},({payload})=>{if(payload?.id!==onlineId && payload?.region===current && typeof payload?.message==='string')appendChat('여행자',payload.message.slice(0,120))});
  room.on('broadcast',{event:'wave'},({payload})=>{if(payload?.id!==onlineId)notice('👋 다른 여행자가 인사했어요!')});
  room.on('presence',{event:'sync'},()=>{
   const state=room.presenceState();const seen=new Set();
   Object.values(state).flat().forEach(p=>{if(p.id!==onlineId){seen.add(p.id);otherAvatar(p)}});
   for(const id of others.keys())if(!seen.has(id))removeOther(id);
  });
  await new Promise((resolve,reject)=>{
   room.subscribe(async status=>{
    if(status==='SUBSCRIBED'){
     await room.track({id:onlineId,region:current,x:player.position.x,z:player.position.z,palette:appearance.palette});
     resolve();
    }else if(status==='CHANNEL_ERROR'||status==='TIMED_OUT')reject(new Error(status));
   });
  });
  onlineState='온라인';notice('👥 실시간 탐험방에 연결됐어요!');
 }catch(err){console.error(err);room=null;onlineState='연결 실패';notice('온라인 연결 실패. 공개 키와 Realtime 설정을 확인해 주세요.')}
}

// v39: Read-only environment preflight for 50% checkpoint.
(()=>{
 const host=document.getElementById('testkitBody');if(!host)return;
 const button=document.createElement('button');button.textContent='🔎 자동 환경 점검';button.id='aururaPreflight';
 const output=document.createElement('pre');output.id='aururaPreflightResult';output.style.cssText='white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;line-height:1.5';
 host.append(button,output);
 button.addEventListener('click',async()=>{
  button.disabled=true;button.textContent='🔎 확인 중…';
  const rows=[];const add=(name,ok,note)=>rows.push(`${ok?'✅':'⚠️'} ${name}: ${note}`);
  let gl=false;try{const canvas=document.createElement('canvas');gl=!!(canvas.getContext('webgl2')||canvas.getContext('webgl'));}catch{}
  add('3D 그래픽',gl,gl?'WebGL 사용 가능':'WebGL 사용 불가');
  add('인터넷 연결',navigator.onLine,navigator.onLine?'온라인 표시':'오프라인 표시');
  add('보안 연결',location.protocol==='https:'||location.hostname==='localhost',location.protocol);
  add('화면 크기',true,`${innerWidth} × ${innerHeight}`);
  add('터치 입력','ontouchstart' in window||navigator.maxTouchPoints>0,'지원 터치 수: '+(navigator.maxTouchPoints||0));
  add('서비스 워커','serviceWorker' in navigator,'serviceWorker' in navigator?'지원':'미지원');
  if('serviceWorker' in navigator){try{const reg=await navigator.serviceWorker.getRegistration();add('PWA 캐시 등록',!!reg,reg?'등록됨':'아직 등록되지 않음');}catch{add('PWA 캐시 등록',false,'확인 실패');}}
  const required=['map','joystick','testkit','testkitPanel','aururaErrorIndicator'];
  const missing=required.filter(id=>!document.getElementById(id));add('필수 UI',missing.length===0,missing.length?'누락: '+missing.join(', '):'요소 확인됨');
  output.textContent='aurura game v39 · 자동 환경 점검\n'+rows.join('\n')+'\n\n※ 환경 점검은 실제 게임 플레이·멀티플레이 정상 작동을 보장하지 않아.';
  button.disabled=false;button.textContent='🔎 자동 환경 점검';
 });
})();
